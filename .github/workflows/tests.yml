name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: pawcare
          POSTGRES_USER: pawcare
          POSTGRES_PASSWORD: pawcare
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U pawcare" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: mkdir -p staticfiles && uv run pytest -q
        env:
          LLM_PROVIDER: fake
          EMBEDDING_PROVIDER: fake
