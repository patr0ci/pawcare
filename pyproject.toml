[project]
name = "pawcare"
version = "0.1.0"
description = "Demo: adding an AI assistant (RAG + tool-calling agent) to an existing Django app"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<6",
    "fastembed>=0.8.1",
    "gunicorn>=26.2.0",
    "openai>=3.24.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
