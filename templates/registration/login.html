{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="stack">{% csrf_token %}
  {{ form.as_p }}
  <button class="button">Log in</button>
</form>
<p class="muted">Just looking? <form method="post" action="{% url 'demo_login' %}" class="inline">{% csrf_token %}<button class="link">Use a demo account</button></form></p>
{% endblock %}
