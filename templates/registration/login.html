{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<form method="post" class="stack">{% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button class="button">Log in</button>
</form>
<form method="post" action="{% url 'demo_login' %}" class="demo-alt">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <span class="muted">Just looking?</span> <button class="link">Use a demo account</button>
</form>
{% endblock %}
