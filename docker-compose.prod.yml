# Production: Postgres + app + Caddy (automatic HTTPS). Usage:
#   DOMAIN=pawcare.example.com docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: pgvector/pgvector:pg17-trixie
    environment:
      POSTGRES_DB: pawcare
      POSTGRES_USER: pawcare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawcare"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Host header: ALLOWED_HOSTS only has the public domain. Long start: first boot migrates, seeds and indexes.
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://localhost:8000/healthz', headers={'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0]}), timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
